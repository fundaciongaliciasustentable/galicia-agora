# One-off: remove the nested copy of the site that deploys created while
# FTPS_DIR held a path (ftp.galiciasustentable.org/www/subdominios/...).
# Fixed target, no inputs: it can only delete that folder.
name: ftps-cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Remove the nested folder and list the web root
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_USER: ${{ secrets.FTPS_USER }}
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
        run: |
          host=$(printf %s "$FTPS_HOST" | tr -d '[:space:]' | sed -E 's#^[A-Za-z]+://##; s#/.*$##; s#:[0-9]*$##')
          lftp -u "$FTPS_USER","$FTPS_PASSWORD" "ftp://$host" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;
            set net:timeout 30; set net:max-retries 5; set ftp:list-options -a;
            echo '== before'; cls -1;
            rm -r ftp.galiciasustentable.org;
            echo '== after'; cls -1;
            quit"
