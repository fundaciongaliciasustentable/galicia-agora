name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      - name: Build site with fixture-free empty catalogue and audit it
        run: |
          npx tsx pipeline/cli.ts catalog
          npx astro build
          npm run audit
