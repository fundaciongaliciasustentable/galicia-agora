        documented: true
        notes: 48 estacións con lat/lon e parámetros.
      - url: https://servizos.meteogalicia.gal/mgrss/caire/jsonDatosActualesParametro.action?idParametro=N
        status: 200
        documented: true
        notes: "Un contaminante, todas as estacións. Doc IT/052: meteo-estaticos.xunta.gal/datosred/infoweb/caire/informes/OTROS/GL/IT_JSON.pdf"
    format: JSON
    auth: ningunha
    frequency:
      declared: horaria
      measured: "horaria (fecha 09:00 local en todas as estacións ás 09:5x)"
      evidence: campo fecha
    limits: Mesma política de bloqueo de IP de MeteoGalicia.
    licence:
      name: abertos.xunta.gal dataset 0055 (CC BY-SA 4.0) / aviso legal MeteoGalicia
      url: https://abertos.xunta.gal/condicions-de-uso
      verified: true
      odbl_compatible: doubt
    coverage: Galicia, 46–48 estacións.
    risks:
      - Datos non validados (flag T); amosar o aviso.
    verdict: go
    verified: true
    checked_at: 2026-10-18
    samples: [calidade-aire/jsonICAActual.json, calidade-aire/jsonEstacionesCaire.json, calidade-aire/IT_JSON.pdf]
    probe:
      url: https://servizos.meteogalicia.gal/mgrss/caire/jsonICAActual.action
      timestamp_path: '"fecha":"([^"]+)"'

