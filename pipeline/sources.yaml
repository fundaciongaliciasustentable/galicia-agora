      - url: https://firms.modaps.eosdis.nasa.gov/api/area/csv/{FIRMS_MAP_KEY}/VIIRS_SNPP_NRT/-9.35,41.8,-6.7,43.8/1
        status: 200
        documented: true
        notes: "Coa MAP_KEY da FGS (segredo FIRMS_MAP_KEY), 18/10/2026: 200 nos catro produtos; en 2 días, SNPP 1, NOAA-20 11, NOAA-21 10, MODIS 1 detección en Galicia. A resposta inclúe a columna instrument."
