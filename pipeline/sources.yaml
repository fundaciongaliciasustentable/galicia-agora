# Source verification register (Phase 0). Schema: pipeline/schema/sources.schema.json
# All calls made 2026-10-18 with the GaliciaAgora User-Agent. Raw samples live in
# pipeline/samples/<id>/ (local only, not committed). Anything not confirmed by a
# real call or a cited page is written as "non verificado".

sources:
  # ───────────────────────── Tempo e aire ─────────────────────────
  - id: meteogalicia-estacions
    name: MeteoGalicia — observación das estacións (10 min)
    phase: 1
    layers: [estacions-meteo]
    operator: MeteoGalicia (Consellería de Medio Ambiente, Xunta de Galicia)
    endpoints:
      - url: https://servizos.meteogalicia.gal/mgrss/observacion/ultimos10minEstacionsMeteo.action
        status: 200
        documented: true
        notes: "Sen parámetros devolve todas as estacións en servizo (~322 KB). Filtros idEst, idParam. Doc: meteogalicia.gal/datosred/infoweb/meteo/docs/rss/JSON_ultimos10min_gl.pdf"
      - url: https://servizos.meteogalicia.gal/mgrss/observacion/listaEstacionsMeteo.action
        status: 200
        documented: true
        notes: 155 estacións con lat/lon, concello e altitude.
    format: JSON
    auth: ningunha
    frequency:
      declared: 10 min
      measured: "10 min, chegada escalonada con atraso de 5–15 min (dúas chamadas, 07:44Z e 07:55Z)"
      evidence: Campo instanteLecturaUTC. Sen Last-Modified nin ETag.
    limits: "Aviso do 17/09/2026: bloqueo temporal de IP por baixa eficiencia de peticións (limiar non publicado). Recomendan unha chamada para todas as estacións cada 10 min."
    licence:
      name: "Aviso legal MeteoGalicia (atribución) / abertos.xunta.gal dataset 0114 (CC BY-SA 4.0)"
      url: https://www.meteogalicia.gal/web/aviso-legal
      quote: "utilizada libremente… co único compromiso de mencionar expresamente a MeteoGalicia"
      verified: true
      odbl_compatible: doubt
    coverage: Toda Galicia, 155 estacións.
    risks:
      - Política de bloqueo de IP con limiar descoñecido.
      - Algunhas estacións con datos vellos (unha con data 2026-09-23); filtrar por idade.
      - Dúas licenzas para o mesmo dato (atribución e BY-SA).
    verdict: go
    verdict_notes: Unha chamada global cada 10 min. Descartar lecturas con máis dunha hora.
    verified: true
    checked_at: 2026-10-18
    samples: [meteogalicia/ultimos10min.json, meteogalicia/estacions.json, meteogalicia/JSON_ultimos10min_gl.pdf]
    probe:
      url: https://servizos.meteogalicia.gal/mgrss/observacion/ultimos10minEstacionsMeteo.action?idParam=TA_AVG_1.5m
      timestamp_path: '"instanteLecturaUTC":"([^"]+)"'

  - id: meteosix-v5
    name: MeteoSIX API v5
    phase: 1
    operator: MeteoGalicia
    endpoints:
      - url: https://servizos.meteogalicia.gal/apiv5/
        status: 200
        documented: true
        notes: 'Sen chave responde 200 con {"exception":{"code":"005",...}}.'
    format: JSON
    auth: Chave persoal gratuíta (por correo)
    frequency: { declared: "predición por modelo", measured: non verificado }
    limits: non verificado
    licence:
      name: Aviso legal MeteoGalicia
      url: https://www.meteogalicia.gal/web/aviso-legal
      verified: true
      odbl_compatible: doubt
    coverage: Galicia (malla dos modelos WRF, WW3, SWAN, ROMS, MOHID).
    risks:
      - "Só predicións, mareas e orto/ocaso: non ten observacións."
    verdict: no-go
    verdict_notes: Non serve para a capa de estacións. Útil na Fase 2 (ondas e mareas).
    alternative: meteogalicia-estacions
    verified: true
    checked_at: 2026-10-18
    samples: [meteogalicia/meteosix_v5_nokey.txt]

  - id: calidade-aire
