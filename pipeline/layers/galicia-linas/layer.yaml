  https://www.ige.gal; censos: elaboración propia con datos extraídos del sitio web del INE:
  www.ine.es. Lugares: © Instituto de Estudos do Territorio. Xunta de Galicia. Raios:
  MeteoGalicia (Xunta de Galicia). Lumes: © Unión Europea, Copernicus EFFIS (JRC).
update_frequency:
  declared: P30D
geometry: none
output: geojson
auth:
  required: false
privacy_notes: Perfís suavizados de agregados; ningún dato persoal.
stale_after: P120D
ingest:
  every: P30D
depends_on:
  - galicia-deformada
  - entidades-poboacion
  - raios-ano
  - historial-queimados
# Lives on its own page (/linas/); the main map does not draw it (SERIES_LAYERS).
style:
  kind: fill
  label_field: id
table:
  fields:
    - id
    - periodo
    - total
    - unidade
    - fonte
