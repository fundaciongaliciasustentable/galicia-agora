privacy_notes: >-
  Só establecementos inscritos como empresa turística (hoteis, pensións, apartamentos, turismo
  rural, albergues, cámpings e vivendas turísticas). As vivendas de uso turístico (VUT) son
  domicilios particulares e non se publican nunca como puntos: a capa vut-concello só dá o
  seu número por concello. Retíranse teléfono, correo electrónico e enderezo. O nome é a
  denominación comercial inscrita no rexistro público.
stale_after: P45D
ingest:
