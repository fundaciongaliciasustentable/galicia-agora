privacy_notes: >-
  Sen datos persoais: avisos oficiais por zona Meteoalerta (polígonos do propio CAP). Só
  avisos amarelos, laranxas e vermellos en vigor ou futuros; quítanse os verdes, os cancelados
  e os caducados. Ata 40 avisos CAP por execución. / Sin datos personales: avisos oficiales
  por zona Meteoalerta; solo amarillos, naranjas y rojos vigentes o futuros.
stale_after: PT1H
ingest:
  every: PT10M
volatile: true
style:
  kind: fill
  color_token: --c-aviso
  label_field: fenomeno
table:
