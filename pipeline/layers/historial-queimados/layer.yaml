    source: Copernicus EFFIS (JRC), modis.ba.poly.2018; Consellería do Medio Rural, Xunta de Galicia, Lumes 2018 por distrito
    source_url: "https://mediorural.xunta.gal/sites/default/files/estatisticas/2018/Lumes_2018_por_Distrito.xlsx"
