id: historial-queimados
title:
  gl: Áreas queimadas por ano (desde 2016)
  es: Áreas quemadas por año (desde 2016)
theme: lume-monte
operator:
  name: Copernicus EFFIS (Comisión Europea, JRC)
  url: https://forest-fire.emergency.copernicus.eu/
# One GetCapabilities per run lists the yearly typeNames; then one GetFeature per
# completed year (2016..current year − 1) with this bbox.
source_url: "https://maps.effis.emergency.copernicus.eu/effis?service=WFS&request=GetFeature&version=2.0.0&typeNames=ms:modis.ba.poly.YYYY&outputFormat=geojson&bbox=41.8,-9.35,43.8,-6.7,urn:ogc:def:crs:EPSG::4326"
licence:
  spdx: CC-BY-4.0
  text_url: https://forest-fire.emergency.copernicus.eu/about-effis/data-license
  verified_at: 2026-10-18
  odbl_compatible: true
  collection: odbl
  notes: >-
    CC BY 4.0, © Unión Europea. Logos excluídos. O servizo WFS está etiquetado como
    «Test Service». As cifras de contexto da Xunta veñen dos ficheiros anuais de Medio Rural
    (aviso legal: reutilización con cita).
attribution: © Unión Europea, Copernicus EFFIS (JRC)
update_frequency:
  # EFFIS does not declare an update frequency for the yearly layers; a new year
  # appears once a year and past years are revised occasionally.
  declared: P365D
geometry: polygon
output: geojson
auth:
  required: false
privacy_notes: >-
  Sen datos persoais. Perímetros de áreas queimadas cartografadas por satélite (MODIS); non
  identifican persoas nin propiedades. / Sin datos personales. Perímetros de áreas quemadas
  cartografiadas por satélite (MODIS); no identifican personas ni propiedades.
stale_after: P90D
ingest:
  every: P30D
style:
  kind: fill
  color_token: --c-queimado
  label_field: ano
table:
  fields:
    - ano
    - data_lume
    - concello
    - provincia
    - area_ha
context:
  - label:
      gl: Como ler as cifras anuais
      es: Cómo leer las cifras anuales
    value: "EFFIS: ha e áreas cartografadas · Xunta: ha e lumes"
    source: Copernicus EFFIS (JRC), capas modis.ba.poly.AAAA; Consellería do Medio Rural, Xunta de Galicia (estatística anual por distrito forestal)
    source_url: https://mediorural.xunta.gal/gl/recursos/estatisticas/estatisticas-forestais/incendios-forestais
    note:
      gl: >-
        As cifras de EFFIS calcúlanse con estes datos (suma de AREA_HA e número de áreas nas
        catro provincias galegas, calculado o 24/10/2026). EFFIS cartografa por satélite (MODIS)
        as áreas queimadas por riba do seu limiar de detección; unha área pode xuntar varios lumes
        e moitos lumes pequenos non chegan a cartografarse, así que o número de áreas non equivale
        ao número de lumes. A Xunta conta cada lume forestal e mide a superficie con outros
        criterios. As dúas cifras móstranse xuntas, sen axustalas. Para 2016 e 2017 a Xunta só
        publica a estatística en PDF e aquí só se dá a cifra de EFFIS.
      es: >-
        Las cifras de EFFIS se calculan con estos datos (suma de AREA_HA y número de áreas en las
        cuatro provincias gallegas, calculado el 24/10/2026). EFFIS cartografía por satélite
        (MODIS) las áreas quemadas por encima de su umbral de detección; un área puede agrupar
        varios incendios y muchos incendios pequeños no llegan a cartografiarse, por lo que el
        número de áreas no equivale al número de incendios. La Xunta cuenta cada incendio
        forestal y mide la superficie con otros criterios. Las dos cifras se muestran juntas, sin
        ajustarlas. Para 2016 y 2017 la Xunta solo publica la estadística en PDF y aquí solo se da
        la cifra de EFFIS.
