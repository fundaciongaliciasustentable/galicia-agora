    source_url: "https://maps.effis.emergency.copernicus.eu/effis?service=WFS&request=GetFeature&version=2.0.0&typeNames=ms:modis.ba.poly.2016&outputFormat=geojson&bbox=41.8,-9.35,43.8,-6.7,urn:ogc:def:crs:EPSG::4326"
    note:
      gl: Só EFFIS; a estatística da Xunta deste ano só está en PDF.
      es: Solo EFFIS; la estadística de la Xunta de este año solo está en PDF.
