  url: https://www.sergas.es/
source_url: https://extranet.sergas.es/sixsanweb/SIXSAN_WEB/proxyKml.ashx?SIXSAN_WEB_KML/MapServer/KmlServer?Composite=false&BBOX=-9.35,41.8,-6.7,43.8
licence:
  spdx: CC-BY-SA-4.0
  text_url: https://abertos.xunta.gal/catalogo/saude-servicios-sociais/-/dataset/0253/mapa-dos-servizos-sanitarios-galicia
  quote: "Creative Commons BY SA 4.0"
  verified_at: 2026-10-24
  odbl_compatible: doubt
  collection: cc-by-sa-4.0
  notes: >-
    Conxunto 0253 «Mapa dos servizos sanitarios de Galicia» en abertos.xunta.gal (CC BY-SA 4.0,
    actualización declarada diaria). O KMZ sae dun KmlServer de ArcGIS sen documentar tras un
    proxy ASP.NET do SERGAS, ligado desde a ficha; o servizo e a súa estabilidade: non
    verificado. Límites de uso: non verificado.
attribution: "Xunta de Galicia. Consellería de Sanidade — Servizo Galego de Saúde (SERGAS)"
update_frequency:
  declared: P1D
  schedule: "40 5 * * *"
geometry: point
output: geojson
auth:
  required: false
privacy_notes: >-
  Sen datos persoais: hospitais públicos e privados e os seus centros de especialidades. Non se
  publican os teléfonos. Titularidade pública ou privada: non verificado, a fonte non a indica
  (só o nome do complexo). Dous cartafoles da fonte solápanse: o dos edificios (83) e o dos
  complexos (31, todos no mesmo punto ca un edificio o 24/10/2026); un complexo só se engade se
  non hai no mesmo concello un edificio co mesmo nome ou a menos de 150 m. O id fórmase con nome
  + concello. O KMZ non trae hora de publicación (published_at baleiro).
stale_after: P3D
ingest:
  every: P1D
style:
  kind: circle
  color_token: --c-hospital
  label_field: nome
table:
  fields: [nome, tipo, complexo, concello, enderezo, cp, codigo_ine, id]
