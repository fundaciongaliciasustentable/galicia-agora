  notes: >-
    Aviso legal de Augas de Galicia (reutilización con cita e sen desnaturalizar) e do IET
    para o IDEG («compatible con CC- BY 4.0 INT»); sen confirmación escrita, aplícase a máis
    restritiva (ADR 0005): colección CC BY-SA. Estado das masas de auga superficiais do plan
    2021–2027 na demarcación Galicia-Costa: 412 ríos, 24 lagos e encoros, 22 de transición,
    29 costeiras e 7 portos. O Miño-Sil (CHMS) non está. Sen as 18 masas subterráneas
    (cubrirían todo o territorio). Os ríos chegan en centos de anacos de dous puntos por
    masa: encadéanse e simplifícanse (Douglas–Peucker, 0,0003°, ≈ 30 m); polígonos
    xeneralizados no servidor (0,0002–0,0003°). Valores do plan traducidos ao galego; é a
    avaliación do plan, non medicións recentes.
