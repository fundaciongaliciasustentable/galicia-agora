privacy_notes: >-
  Non se publica o campo solicitante (quen rexistrou o equipo): ás veces é unha persoa física.
  Quítanse os equipos en domicilios particulares (tipo «En Domicilio particular» ou texto con
  domicilio, vivenda, piso ou particular; 8 en novembro de 2026). O texto da localización
  publícase sen teléfonos e queda baleiro cando o solicitante é unha persoa e o texto repite o
  seu nome (18 casos, sobre todo farmacias e clínicas co nome do titular).
