  quote: "Creative Commons BY SA 4.0"
  verified_at: 2026-10-24
  odbl_compatible: doubt
  collection: cc-by-sa-4.0
  notes: >-
    Conxunto 0253 «Mapa dos servizos sanitarios de Galicia» en abertos.xunta.gal (CC BY-SA 4.0,
    actualización declarada diaria). O KMZ sae dun KmlServer de ArcGIS sen documentar tras un
