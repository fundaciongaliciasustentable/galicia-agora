    verificado. Límites de uso: non verificado.
attribution: "Xunta de Galicia. Consellería de Sanidade — Servizo Galego de Saúde (SERGAS)"
update_frequency:
  declared: P1D
  schedule: "40 5 * * *"
geometry: point
output: geojson
auth:
  required: false
privacy_notes: >-
  Sen datos persoais: centros públicos de atención primaria. Non se publican os teléfonos. A
  fonte non dá código dos centros: o id fórmase con tipo + nome + concello e cambia se o SERGAS
  renomea o centro. 92 dos 100 PAC funcionan no mesmo centro de saúde e coinciden no mapa con
  el. O KMZ non trae hora de publicación (published_at baleiro). O código INE sae do nome do
  concello comparado coa táboa de concellos-parroquias; «Carballeda» (Avia ou Valdeorras) queda
  sen código.
stale_after: P3D
ingest:
  every: P1D
style:
  kind: circle
  color_token: --c-saude
  label_field: nome
table:
  fields: [nome, tipo, concello, enderezo, cp, codigo_ine, id]
