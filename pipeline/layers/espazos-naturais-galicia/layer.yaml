  notes: >-
    Dobre licenza (ADR 0005): IET «compatible con CC BY 4.0» / abertos.xunta.gal
    CC BY-SA 4.0; aplícase a máis restritiva ata confirmación escrita.
    Figuras da Rede Galega de Espazos Protexidos fóra de Rede Natura (subcapas
    1–6 de EN_EspazosProtexidos): parque nacional, parques naturais, humidais
    protexidos, ZEPVN, monumentos naturais e paisaxes protexidas. Moitas
    sobrepóñense a espazos Natura 2000 (capa rede-natura). Xeometría
    xeneralizada no servidor con maxAllowableOffset = 0,0001° (≈ 10 m) e
    coordenadas a 5 decimais. Nomes tal como os publica o IET.
