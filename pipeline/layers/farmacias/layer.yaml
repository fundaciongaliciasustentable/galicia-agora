privacy_notes: >-
  A fonte identifica cada farmacia polos nomes das persoas titulares (TITULAR1–3) e dá un
  teléfono: non se publica ningún dos dous. Cada farmacia leva o seu código oficial (SIGLAS, por
  exemplo C-224-F) como id e como nome. Sen horarios nin servizo de garda. O KMZ non trae hora
  de publicación (published_at baleiro).
stale_after: P3D
ingest:
  every: P1D
