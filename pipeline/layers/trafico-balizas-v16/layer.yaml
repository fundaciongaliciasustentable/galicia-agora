  schedule: "*/10 * * * *"
geometry: point
output: geojson
auth:
  required: false
privacy_notes: >-
  Unha baliza V16 sinala un vehículo particular detido na estrada. Só en directo: nunca se
  publica nin se garda o identificador V16_ nin ningún hash derivado. O id de cada punto é
  a súa orde nesta descarga (1..n, por estrada e quilómetro), polo que non permite seguir
  un dispositivo entre descargas. A hora de inicio redondéase a 5 minutos, as coordenadas a
  4 decimais (uns 10 m) e o punto quilométrico a 100 m. Sen histórico: só o ficheiro actual.
stale_after: PT30M
ingest:
  every: PT10M
volatile: true
style:
  kind: circle
  color_token: --c-aviso
  label_field: estrada
table:
  fields: [estrada, pk, concello, provincia, desde]
