context:
  - label:
      gl: Cobertura
      es: Cobertura
    value: Só tramos ARPSI
    source: SNCZI (MITECO)
    source_url: https://wmts-snczi.idee.es/wmts/riesgos-naturales/inundaciones?SERVICE=WMTS&REQUEST=GetCapabilities
    note:
      gl: >-
        Só cobre as Áreas de Risco Potencial Significativo de Inundación (ARPSI) das
        demarcacións Galicia-Costa e Miño-Sil, non todos os ríos. Fóra deses tramos, que
        non haxa cor non quere dicir que non haxa perigo.
      es: >-
        Solo cubre las Áreas de Riesgo Potencial Significativo de Inundación (ARPSI) de las
        demarcaciones Galicia-Costa y Miño-Sil, no todos los ríos. Fuera de esos tramos, la
        ausencia de color no significa ausencia de peligro.
  - label:
      gl: Lenda
      es: Leyenda
    value: Calado en metros, de < 0,2 m (azul claro) a > 2 m (azul escuro)
    source: Lenda do WMTS do SNCZI
    source_url: https://wmts-snczi.idee.es/wmts/riesgos-naturales/inundaciones/leyendas/riesgos-naturales-fluvial.png
    note:
      gl: >-
        Sete clases: < 0,2 · 0,2–0,4 · 0,4–0,7 · 0,7–1,0 · 1,0–1,5 · 1,5–2,0 · > 2,0 m.
        Período de retorno de 10 anos: probabilidade alta (RD 903/2010).
      es: >-
        Siete clases: < 0,2 · 0,2–0,4 · 0,4–0,7 · 0,7–1,0 · 1,0–1,5 · 1,5–2,0 · > 2,0 m.
        Periodo de retorno de 10 años: probabilidad alta (RD 903/2010).
