id: entidades-poboacion
title:
  gl: Entidades de poboación
  es: Entidades de población
theme: territorio
operator:
  name: Instituto de Estudos do Territorio (Xunta de Galicia)
  url: https://mapas.xunta.gal
source_url: https://ideg.xunta.gal/servizos/rest/services/PBA/EntidadesPoboacion_PBA/MapServer/0/query
licence:
  spdx: CC-BY-SA-4.0
  text_url: https://mapas.xunta.gal/gl/aviso-legal
  verified_at: 2026-10-18
  odbl_compatible: doubt
  collection: cc-by-sa-4.0
  notes: >-
    Dobre licenza (ADR 0005): o IET declara «compatible con CC BY 4.0» e
    abertos.xunta.gal publica os seus conxuntos baixo CC BY-SA 4.0; aplícase a
    máis restritiva ata confirmación escrita do IET/Amtega. 36.190 puntos;
    COD_IGRP non é único (os lugares LU e os núcleos PU levan un código de
    parroquia rematado en 0099 / 0098). As etiquetas de TIPO_ENTID dedúcense dos
    datos (o servizo non publica a lista de códigos) e non están verificadas.
    A data de publicación é o mes de edición que o servizo indica no texto
    («Decembro 2025»), día 1.
attribution: © Instituto de Estudos do Territorio. Xunta de Galicia (PBA)
update_frequency:
  declared: static
  measured: static
geometry: point
output: geojson
auth:
  required: false
privacy_notes: >-
  Toponimia oficial e poboación agregada por entidade (padrón 2024); ningún dato
  persoal. Para lugares (LU) e núcleos do planeamento (PU) a fonte dá 0
  habitantes porque non son entidades do INE: publícase sen dato (null).
stale_after: P90D
ingest:
  every: P30D
style:
  kind: circle
  color_token: --c-limite
  label_field: nome
table:
  fields: [nome, tipo_nome, poboacion, codigo, codigo_parroquia, codigo_ine]
