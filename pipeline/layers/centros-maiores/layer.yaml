privacy_notes: >-
  Retíranse o correo electrónico (Mail, Correo), o teléfono, o horario e as instalacións.
  A entidade titular publícase só cando é unha organización (forma xurídica como SL, SA,
  SC ou cooperativa, ou palabras como fundación, asociación, concello, congregación); cando
  é unha persoa física (unhas 40 vivendas comunitarias e centros de día pequenos en outubro
  de 2026) ou o nome leva un NIF, queda baleira. O nome do centro é o rexistrado no RUEPSS.
