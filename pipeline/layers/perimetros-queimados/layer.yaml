    value: "148.581 ha (258 áreas cartografadas; calculado o 18/10/2026)"
    source: Copernicus EFFIS (JRC), capa modis.ba.poly.2025, suma de AREA_HA para A Coruña, Lugo, Ourense e Pontevedra
    source_url: "https://maps.effis.emergency.copernicus.eu/effis?service=WFS&request=GetFeature&version=2.0.0&typeNames=ms:modis.ba.poly.2025&outputFormat=geojson&bbox=41.8,-9.35,43.8,-6.7,urn:ogc:def:crs:EPSG::4326"
