id: inundacion-costeira
title:
  gl: Zonas inundables na costa (100 e 500 anos)
  es: Zonas inundables en la costa (100 y 500 años)
theme: auga-mar
operator:
  name: Xunta de Galicia — Augas de Galicia (Directiva 2007/60/CE), servizo no IDEG
  url: https://augasdegalicia.xunta.gal/
source_url: https://ideg.xunta.gal/servizos/rest/services/IDE_DHGC/D2007_60_MapasInundablesCosteiros/MapServer
licence:
  spdx: CC-BY-SA-4.0
  text_url: https://augasdegalicia.xunta.gal/aviso-legal
  verified_at: 2026-11-01
  odbl_compatible: doubt
  collection: cc-by-sa-4.0
  notes: >-
    Aviso legal de Augas de Galicia (reutilización con cita e sen desnaturalizar) e do IET
    para o IDEG («compatible con CC- BY 4.0 INT»); sen confirmación escrita, aplícase a máis
    restritiva (ADR 0005): colección CC BY-SA. O estudo é do SNCZI (Ministerio de
    Agricultura, Alimentación e Medio Ambiente, 2014) para a demarcación Galicia-Costa;
    MITECO publica o mesmo tema en ráster con CC BY 4.0 (fonte zonas-inundables), pero aquí
    úsase o vector do servizo de Augas. Subcapas 3 (T100, 28 polígonos) e 4 (T500, 28), unha
    por ARPSI costeira (áreas de risco potencial significativo), ciclo 2015–2021: só cobre
    eses tramos de costa, non toda a costa. Xeneralización no servidor con
    maxAllowableOffset = 0,0001° (≈ 10 m). Sen o risco para a poboación (subcapas 5–12).
attribution: "Augas de Galicia (Xunta de Galicia); mapas de perigosidade do SNCZI, Ministerio de Agricultura, Alimentación e Medio Ambiente"
update_frequency:
  declared: static
  measured: static
geometry: polygon
output: geojson
auth:
  required: false
privacy_notes: Láminas de inundación por zonas; ningún dato persoal.
stale_after: P90D
ingest:
  every: P30D
style:
  kind: fill
  color_token: --c-inundacion
  label_field: zona
table:
  fields: [zona, periodo_retorno, superficie_km2, lonxitude_km, cota_max_m, arpsi, data_estudo]
