geometry: point
output: geojson
auth:
  required: false
privacy_notes: >-
  Retíranse os correos (Mail, Correo; moitos son contas persoais de Gmail), o teléfono, o
  horario e as instalacións. A entidade titular publícase só cando é unha organización (mesma
  regra ca centros-maiores); cando é unha persoa física ou non se recoñece (84 centros en
  novembro de 2026, sobre todo escolas infantís privadas pequenas), queda baleira. O nome do
  centro é o rexistrado no RUEPSS.
stale_after: P45D
ingest:
  every: P7D
style:
