id: seculo-movemento
title:
  gl: Un século en movemento (poboación por censo e lugares habitados)
  es: Un siglo en movimiento (población por censo y lugares habitados)
theme: territorio
operator:
  name: Fundación Galicia Sustentable (cálculo propio con datos do INE e o IET)
  url: https://mapas.galiciasustentable.org
source_url: https://www.ine.es/intercensal/
licence:
  spdx: CC-BY-SA-4.0
  text_url: https://creativecommons.org/licenses/by-sa/4.0/deed.gl
  quote: "Creative Commons BY SA 4.0"
  verified_at: 2026-11-04
  odbl_compatible: doubt
  collection: cc-by-sa-4.0
  notes: >-
    Capa derivada sen descarga externa: poboación de cada censo de 1900 a 2021 (poboacion-seculo,
    INE, CC BY 4.0, harmonizada aos 313 concellos), un punto por concello (centroide do seu polígono
    maior, galicia-deformada) e ata 24 lugares onde vive a xente hoxe (entidades-poboacion, IET, CC
    BY-SA 4.0; os de máis poboación), que serven de ancoraxe para os puntos da páxina. Os lugares
    son os de hoxe: en 1900 a xente dun concello repartíase doutra maneira dentro del.
attribution: >-
  Elaboración propia con datos extraídos del sitio web del INE: www.ine.es (censos 1900–2021).
  Lugares: © Instituto de Estudos do Territorio. Xunta de Galicia (PBA). Cálculos: Fundación
  Galicia Sustentable.
update_frequency:
  declared: static
geometry: point
output: geojson
auth:
  required: false
privacy_notes: Poboación agregada por concello e censo; ningún dato persoal.
stale_after: P3650D
ingest:
  every: P365D
depends_on:
  - poboacion-seculo
  - entidades-poboacion
  - galicia-deformada
# Lives on its own /pulso/ page; the main map does not draw it (SERIES_LAYERS).
style:
  kind: circle
  label_field: nome
table:
  fields:
    - nome
    - codigo_ine
