  notes: >-
    Dobre licenza (ADR 0005): IET «compatible con CC BY 4.0» / abertos.xunta.gal CC BY-SA
    4.0; aplícase a máis restritiva ata confirmación escrita. 987 praias costeiras (A
    Coruña, Lugo e Pontevedra) nunha soa páxina (maxRecordCount 1000). Sen bandeira azul:
    o campo B_AZUL do servizo non di de que ano é, e a lista de 2026 de abertos.xunta.gal
    (PraiasBandeiraAzul_2026.csv, 126 filas, 8 baleiras) non casa ben por posición co
    servizo (29 de 118 casaban con outra praia; as praias fluviais non están nesta capa).
    A clasificación natural/urbana é a da fonte; 42 urbanas levan «URBANA *» sen
    explicación. Praias partidas en tramos aparecen unha vez por tramo.
